business.work.end=20
# поставить 24 если круглосуточно

# ID пользователей Telegram, у которых будет доступ к админ-панели (через запятую)
business.admin.ids=5858194068,12345678,98765432

# Максимальное количество активных записей на ОДНУ и ту же услугу для одного клиента
business.max.bookings.per.service=2

# Рабочие дни недели (Пн, Вт, Ср, Чт, Пт — работаем, Сб, Вс — выходной)
business.work.days=1,1,1,1,1,0,0

