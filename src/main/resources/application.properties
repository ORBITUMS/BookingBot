# Настройки подключения к PostgreSQL в Минске
spring.datasource.url=jdbc:postgresql://localhost:5432/bookingdb
spring.datasource.username=postgres
# Вставь сюда тот самый пароль, который ты указал в Шаге 2:
spring.datasource.password=admin321

# Драйвер базы данных
spring.datasource.driverClassName=org.postgresql.Driver

# Автоматически создавать и обновлять таблицы под наши Java-классы
spring.jpa.hibernate.ddl-auto=update
# Показывать в консоли VS Code SQL-запросы, которые Java шлет в базу (очень удобно для учебы!)
spring.jpa.show-sql=true

# Глобальный график работы салона (в часах)
